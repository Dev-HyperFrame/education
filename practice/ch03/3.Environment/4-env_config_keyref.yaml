apiVersion: v1
kind: Pod
metadata:
  creationTimestamp: null
  labels:
    app: env-config-pod02
  name: env-config-pod02
spec:
  containers:
  - image: josunghwan/env_sample:v01	 	  
    name: test
    env:
    - name: TEST    # 환경 변수 Key 값 설정
      valueFrom:
        configMapKeyRef:     # 환경 변수 Value 값 설정  
          name: env-config
          key: SAMPLE	  # 해당 Key의 Value값 가져온다.
  dnsPolicy: ClusterFirst
  restartPolicy: Never

